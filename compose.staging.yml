name: portfolio-staging

services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:-ghcr.io/albertomateus9/albertomateus9.github.io:staging}
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "1001:1001"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENV: staging
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 256
        reservations:
          cpus: "0.10"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge

networks:
  edge:
    name: ${DOKPLOY_NETWORK:-dokploy-network}
    external: true

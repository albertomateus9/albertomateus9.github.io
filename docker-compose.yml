services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: albertomateus-portfolio:latest
    container_name: albertomateus-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0

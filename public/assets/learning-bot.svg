<rect x="46" y="59" width="62" height="34" rx="10" fill="#0d1117"/>
<rect class="eye" x="57" y="67" width="10" height="14" rx="5" fill="#7ee787"/>
<rect class="eye" x="86" y="67" width="10" height="14" rx="5" fill="#7ee787"/>
<path d="M71 85Q77 90 83 85" fill="none" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round"/>
<rect x="45" y="112" width="64" height="47" rx="13" fill="#161b22" stroke="#79c0ff" stroke-width="3"/>
<text x="77" y="141" fill="#d2a8ff" font-family="ui-monospace,monospace" font-size="14" text-anchor="middle">alpha</text>
<path d="M44 123L29 142" fill="none" stroke="#79c0ff" stroke-width="8" stroke-linecap="round"/>
<circle cx="27" cy="146" r="7" fill="#7ee787"/>
<g class="hand">

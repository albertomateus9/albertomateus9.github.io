<svg xmlns="http://www.w3.org/2000/svg" width="160" height="206" viewBox="0 0 160 206" role="img" aria-labelledby="title desc">
<title id="title">Robô aprendiz acenando</title>
<desc id="desc">Um pequeno robô com antena, olhos piscando e uma mão que acena. No corpo está escrito alpha.</desc>
<style>
.float { animation: float 4s ease-in-out infinite; }
.hand { transform-origin: 126px 108px; animation: wave 3.4s ease-in-out infinite; }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 7s ease-in-out infinite; }
.signal { animation: signal 3s ease-in-out infinite; }
@keyframes float { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-5px)} }
@keyframes wave { 0%,60%,100% {transform:rotate(0deg)} 15%,35% {transform:rotate(15deg)} 25%,45% {transform:rotate(-10deg)} }
@keyframes blink { 0%,43%,47%,100% {transform:scaleY(1)} 45% {transform:scaleY(.12)} }
@keyframes signal { 0%,100% {opacity:.5} 50% {opacity:1} }
@media (prefers-reduced-motion: reduce) { .float, .hand, .eye, .signal {animation:none;} }
</style>
<ellipse cx="76" cy="184" rx="43" ry="7" fill="#30363d" opacity=".35"/>
<g class="float">
<path d="M77 44V32" stroke="#79c0ff" stroke-width="5" stroke-linecap="round"/>
<circle class="signal" cx="77" cy="26" r="7" fill="#7ee787"/>

  <text x="78" y="236" fill="#f0f7fb" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">
    <tspan x="78" dy="0">Entre o mundo físico e a</tspan>
    <tspan x="78" dy="74">inteligência, eu construo</tspan>
    <tspan x="78" dy="74">o sistema inteiro.</tspan>
  </text>
  <text x="78" y="506" fill="#a7bdcc" font-family="Arial, sans-serif" font-size="24">telecomunicações · infraestrutura · software · dados · inteligência artificial</text>
  <path d="M78 551h1044" stroke="#294157"/>
  <text x="78" y="591" fill="#d9e7ef" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="1">ALBERTO MATEUS</text>
  <text x="930" y="591" fill="#a7bdcc" font-family="Arial, sans-serif" font-size="19" letter-spacing="1">BELÉM · BRASIL</text>
  <g transform="translate(995 150)" fill="none" stroke="#43ddff">
    <circle r="76" stroke-opacity=".2"/><circle r="49" stroke-opacity=".35"/><circle r="7" fill="#43ddff"/>
    <path d="M-76 0h-58M76 0h58M0-76v-44M0 76v44" stroke-opacity=".35"/>

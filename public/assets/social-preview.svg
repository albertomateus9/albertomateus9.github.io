<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Alberto Mateus — engenharia full-cycle, pesquisa e IA aplicada</title>
  <desc id="description">Cartão social do Portfolio OS com a narrativa entre o mundo físico e a inteligência.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1110" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1a2b"/>
      <stop offset="1" stop-color="#06101d"/>
    </linearGradient>
    <radialGradient id="signal" cx="0" cy="0" r="1" gradientTransform="translate(965 160) rotate(135) scale(430)">
      <stop stop-color="#43ddff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#43ddff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#8ab1ca" stroke-opacity=".075"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#signal)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M76 65h1048" stroke="#43ddff" stroke-opacity=".4"/>
